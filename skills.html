
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

<div class="w-full py-8 md:py-12">

    </div>

    <!-- GRID SKILLS -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- Skill 1 -->
        <div class="bg-white border border-pink-200 rounded-3xl p-6 shadow-md hover:shadow-xl transition">

            <div class="flex justify-between items-center mb-5">

                    📊
                </div>

             
            </div>

            </h3>

            <div class="w-full bg-pink-100 rounded-full h-3">
                <div class="bg-pink-500 h-3 rounded-full" style="width:85%"></div>
            </div>

        </div>

        <!-- Skill 2 -->
        <div class="bg-white border border-pink-200 rounded-3xl p-6 shadow-md hover:shadow-xl transition">

            <div class="flex justify-between items-center mb-5">

                <div class="w-14 h-14 rounded-2xl bg-pink-50 flex items-center justify-center text-2xl">
                    📈
                </div>

               

            </div>

            <h3 class="text-2xl font-bold text-gray-800 mb-4">
                Microsoft Office
            </h3>

            <div class="w-full bg-pink-100 rounded-full h-3">
                <div class="bg-pink-500 h-3 rounded-full" style="width:90%"></div>
            </div>

        </div>

        <!-- Skill 3 -->
        <div class="bg-white border border-pink-200 rounded-3xl p-6 shadow-md hover:shadow-xl transition">

            <div class="flex justify-between items-center mb-5">

                <div class="w-14 h-14 rounded-2xl bg-pink-50 flex items-center justify-center text-2xl">
                    🏸
                </div>

              
            </div>

            <h3 class="text-2xl font-bold text-gray-800 mb-4">
                Badminton
            </h3>

            <div class="w-full bg-pink-100 rounded-full h-3">
                <div class="bg-pink-500 h-3 rounded-full" style="width:88%"></div>
            </div>

        </div>

        <!-- Skill 4 -->
        <div class="bg-white border border-pink-200 rounded-3xl p-6 shadow-md hover:shadow-xl transition">

            <div class="flex justify-between items-center mb-5">

                <div class="w-14 h-14 rounded-2xl bg-pink-50 flex items-center justify-center text-2xl">
                    💻
                </div>

               

            </div>

            <h3 class="text-2xl font-bold text-gray-800 mb-4">
                Basic WEB Design
            </h3>

            <div class="w-full bg-pink-100 rounded-full h-3">
                <div class="bg-pink-500 h-3 rounded-full" style="width:75%"></div>
            </div>

        </div>

    </div>

    <!-- INFO -->
    <div class="mt-8 bg-pink-50 border border-pink-200 rounded-2xl p-5">

        <p class="text-gray-700 text-center text-base md:text-lg">
            🚀 Terus belajar dan mengembangkan skill untuk meningkatkan kompetensi akademik maupun profesional.
        </p>

    </div>

</div>

</body>
</html>
